openapi: 3.1.0
info:
  title: Anar-Core vNext Authority API
  version: 0.3.12-pre.1
  description: >-
    Pre-freeze contract. This file defines a testable interface and does not
    assert that a production endpoint exists or is authorized.
x-production-authority: NONE
servers: []
paths:
  /v1/authority-contexts:
    post:
      operationId: createAuthorityContext
      responses:
        "201": {description: Fresh bounded authority context created}
        "403": {description: Current identity or membership not established}
        "409": {description: Stale or contradictory current state}
  /v1/authority-contexts/{authority_context_id}/revoke:
    post:
      operationId: revokeAuthorityContext
      parameters:
        - name: authority_context_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Context revoked through an authorized mutation path}
        "403": {description: Administrative authority not established}
  /v1/decisions/evaluate:
    post:
      operationId: evaluateCapability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./authority-request.v1.schema.json
      responses:
        "200": {description: Material decision and immutable receipt projection}
        "400": {description: Bounded parser or typed semantic rejection}
        "409": {description: Authority changed during evaluation or finalization}
        "503": {description: Authoritative substrate unavailable; no ALLOW issued}
  /v1/decisions/{decision_id}:
    get:
      operationId: getDecision
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Decision projection visible within current authority}
        "404": {description: Unavailable without tenant-existence disclosure}
  /v1/receipts/{receipt_id}:
    get:
      operationId: getReceipt
      parameters:
        - name: receipt_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Immutable receipt projection
          content:
            application/json:
              schema:
                $ref: ./decision-receipt.v1.schema.json
        "404": {description: Unavailable without tenant-existence disclosure}
  /v1/delegations:
    post:
      operationId: createDelegation
      responses:
        "201": {description: Narrowed delegation created after current delegator authority proof}
        "400": {description: Typed scope, time, use, or delegation constraint rejected}
        "403": {description: Current delegable authority not established}
        "409": {description: Authority changed before mutation finalization}
  /v1/delegations/{delegation_id}/revoke:
    post:
      operationId: revokeDelegation
      parameters:
        - name: delegation_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Delegation revoked and authority generation advanced atomically}
        "403": {description: Administrative authority not established}
        "404": {description: Unavailable without tenant-existence disclosure}
  /v1/elevations/request:
    post:
      operationId: requestPurposeBoundElevation
      responses:
        "201": {description: Bounded purpose-specific elevation created from an authorized grant}
        "400": {description: Purpose, reason, expiry, use, or scope binding rejected}
        "403": {description: Issuer authority not established}
        "409": {description: Authority changed before mutation finalization}
  /v1/elevations/{elevation_id}/revoke:
    post:
      operationId: revokeElevation
      parameters:
        - name: elevation_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Elevation revoked through a one-shot authorized mutation}
        "403": {description: Administrative authority not established}
        "404": {description: Unavailable without tenant-existence disclosure}
  /v1/assertions:
    post:
      operationId: createExternalStateAssertion
      responses:
        "201": {description: Assertion recorded with exact object, payload, issuer, and provenance digests}
        "400": {description: Typed assertion or issuer-class contract rejected}
        "403": {description: Assertion issuance authority not established}
        "409": {description: Assertion conflicts with current immutable state}
  /v1/assertions/{assertion_id}/revoke:
    post:
      operationId: revokeExternalStateAssertion
      parameters:
        - name: assertion_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Assertion revoked and dependency state advanced atomically}
        "403": {description: Assertion revocation authority not established}
        "404": {description: Unavailable without tenant-existence disclosure}
  /v1/organizations/{organization_id}/memberships:
    get:
      operationId: listOrganizationMemberships
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Tenant-isolated membership projections}
        "404": {description: Unavailable without tenant-existence disclosure}
  /v1/organizations/{organization_id}/units:
    get:
      operationId: listOrganizationUnits
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Tenant-isolated organization unit projections}
        "404": {description: Unavailable without tenant-existence disclosure}
