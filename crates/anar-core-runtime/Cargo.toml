[package]
name = "anar-core-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anar-core-engine = { path = "../anar-core-engine" }
anar-core-types = { path = "../anar-core-types" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
thiserror.workspace = true


[features]
postgres = ["dep:sqlx", "dep:tokio"]

[dependencies.sqlx]
version = "0.8.6"
default-features = false
features = ["postgres", "runtime-tokio", "uuid", "json"]
optional = true

[dependencies.tokio]
version = "1.47.1"
features = ["macros", "rt-multi-thread"]
optional = true

[[example]]
name = "sqlx_probe"
required-features = ["postgres"]
